<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Work Steps Backup Viewer</title><style>
*{box-sizing:border-box}body{margin:0;background:#f3f5f7;color:#17232d;font:16px system-ui,-apple-system,Segoe UI,sans-serif}header{background:#17324d;color:#fff;padding:22px max(18px,calc((100% - 1050px)/2));display:flex;justify-content:space-between;align-items:center;gap:20px}h1,h2,p{margin-top:0}header p{margin-bottom:0;color:#dbe7ef}.open,button{display:inline-block;background:#1670b7;color:#fff;border:0;border-radius:8px;padding:11px 15px;font:inherit;font-weight:700;cursor:pointer}.open input{display:none}main{max-width:1050px;margin:22px auto;padding:0 16px}.card,.step{background:#fff;border:1px solid #d7e0e7;border-radius:12px;padding:18px;margin-bottom:16px;box-shadow:0 2px 8px #12202f12}#drop{border:3px dashed #8ca0b0;border-radius:12px;padding:45px;text-align:center;color:#536675}.drag{background:#e8f4fd}.error{color:#a22020;font-weight:700}#toolbar{display:flex;align-items:center;gap:12px;position:sticky;top:0;z-index:3;flex-wrap:wrap}#search{flex:1;min-width:240px;padding:11px;border:1px solid #94a7b5;border-radius:8px;font:inherit}select{padding:10px;border-radius:8px;font:inherit}.danger{background:#a43d3d}#stats{width:100%;color:#506372}.step-head{display:flex;gap:15px;align-items:flex-start}.number{flex:0 0 44px;height:44px;border-radius:50%;background:#17324d;color:#fff;display:grid;place-items:center;font-weight:800}.step-body{flex:1}.step-text{font-size:19px;font-weight:700;margin-bottom:7px}.meta{color:#60717e}.picture{display:block;max-width:100%;max-height:650px;margin-top:15px;border:1px solid #bdcbd5;border-radius:9px;cursor:zoom-in}.no-results{text-align:center;padding:35px;color:#657783}dialog{border:0;border-radius:10px;max-width:95vw;max-height:95vh;padding:12px}dialog::backdrop{background:#000c}dialog img{display:block;max-width:90vw;max-height:82vh}#closePic{margin-bottom:8px}@media(max-width:650px){header{align-items:flex-start;flex-direction:column}.step-head{gap:10px}.number{flex-basis:36px;height:36px}}@media print{header,#welcome,#toolbar{display:none!important}body{background:#fff}.step{box-shadow:none;break-inside:avoid}.picture{max-height:500px}}

</style></head><body><header><div><h1>Work Steps Backup Viewer</h1><p>Open a recorder backup JSON file and view its steps and embedded pictures locally.</p></div><label class="open">Open backup JSON<input id="file" type="file" accept="application/json,.json"></label></header><main><section id="welcome" class="card"><h2>Choose your backup</h2><p>Click <strong>Open backup JSON</strong> and select <code>work-steps-backup.json</code>. The file stays in this browser and is not uploaded.</p><div id="drop">Or drag and drop the JSON file here</div><p id="error" class="error" hidden></p></section><section id="toolbar" class="card" hidden><input id="search" placeholder="Search steps..."><label><input id="picsOnly" type="checkbox"> Pictures only</label><select id="sort"><option value="old">Oldest first</option><option value="new">Newest first</option></select><button id="print">Print / Save PDF</button><button id="close" class="danger">Close file</button><div id="stats"></div></section><section id="steps"></section></main><dialog id="lightbox"><button id="closePic" aria-label="Close">Close</button><img id="large" alt="Expanded attachment"></dialog><script>
const $=id=>document.getElementById(id);let all=[];
function duration(ms){let s=Math.max(0,Math.floor((Number(ms)||0)/1000));return [Math.floor(s/3600),Math.floor(s%3600/60),s%60].map(n=>String(n).padStart(2,'0')).join(':')}
function esc(s=''){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
async function openFile(file){$('error').hidden=true;try{const raw=await file.text();const data=JSON.parse(raw);if(!data||!Array.isArray(data.steps))throw new Error('This JSON does not contain a steps array.');all=data.steps.map((s,i)=>({id:s.id||String(i),text:String(s.text||''),time:s.time||'',elapsedMs:s.elapsedMs||0,image:typeof s.image==='string'&&s.image.startsWith('data:image/')?s.image:null}));$('welcome').hidden=true;$('toolbar').hidden=false;render()}catch(e){$('error').textContent='Could not open this backup: '+e.message;$('error').hidden=false}}
function render(){let q=$('search').value.trim().toLowerCase();let list=all.filter(s=>(!q||s.text.toLowerCase().includes(q))&&(!$('picsOnly').checked||s.image));if($('sort').value==='new')list=[...list].reverse();$('stats').textContent=`Showing ${list.length} of ${all.length} steps · ${all.filter(s=>s.image).length} with pictures`;$('steps').innerHTML=list.length?list.map((s,i)=>`<article class="step"><div class="step-head"><div class="number">${$('sort').value==='new'?all.indexOf(s)+1:all.indexOf(s)+1}</div><div class="step-body"><div class="step-text">${esc(s.text)}</div><div class="meta">${s.time?new Date(s.time).toLocaleString():'No timestamp'} · Timer ${duration(s.elapsedMs)}</div>${s.image?`<img class="picture" src="${s.image}" alt="Picture attached to step ${all.indexOf(s)+1}">`:'<div class="meta">No picture attached</div>'}</div></div></article>`).join(''):'<div class="no-results">No matching steps.</div>';document.querySelectorAll('.picture').forEach(img=>img.onclick=()=>{$('large').src=img.src;$('lightbox').showModal()})}
$('file').onchange=e=>{if(e.target.files[0])openFile(e.target.files[0])};['search','picsOnly','sort'].forEach(id=>$(id).addEventListener(id==='search'?'input':'change',render));$('print').onclick=()=>window.print();$('close').onclick=()=>{all=[];$('steps').innerHTML='';$('toolbar').hidden=true;$('welcome').hidden=false;$('file').value=''};$('closePic').onclick=()=>$('lightbox').close();$('lightbox').onclick=e=>{if(e.target===$('lightbox'))$('lightbox').close()};const drop=$('drop');['dragenter','dragover'].forEach(n=>drop.addEventListener(n,e=>{e.preventDefault();drop.classList.add('drag')}));['dragleave','drop'].forEach(n=>drop.addEventListener(n,e=>{e.preventDefault();drop.classList.remove('drag')}));drop.addEventListener('drop',e=>{if(e.dataTransfer.files[0])openFile(e.dataTransfer.files[0])});

</script></body></html>
